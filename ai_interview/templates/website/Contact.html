{% extends 'base.html' %}

{% block title %}Contact - AI Mock Interview System{% endblock %}

{% block content %}
<section class="section animate-up">
    <div class="container" style="max-width: 800px; text-align: center;">
        <h1 class="accent">Get in Touch</h1>
        <p>Have questions or feedback? We'd love to hear from you.</p>
        
        <div class="card" style="margin-top: 3rem; text-align: left;">
            <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 250px;">
                    <h3>Contact Information</h3>
                    <div style="margin-top: 1.5rem;">
                        <p><i class="fas fa-envelope" style="color: var(--primary); margin-right: 0.5rem;"></i> support@aimockinterview.com</p>
                        <p><i class="fas fa-map-marker-alt" style="color: var(--secondary); margin-right: 0.5rem;"></i> Silicon Valley, CA</p>
                    </div>
                </div>
                <div style="flex: 1; min-width: 250px;">
                    <form>
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" class="form-control" placeholder="Your Name">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" class="form-control" placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea class="form-control" rows="4" placeholder="How can we help?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
