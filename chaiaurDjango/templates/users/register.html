{% extends 'base.html' %}

{% block title %}Register - AI Mock Interview System{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="card form-card animate-up">
            <h2 style="text-align: center; margin-bottom: 2rem;">Create <span class="accent">Account</span></h2>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1.5rem;"> Get Started <i class="fas fa-rocket"></i></button>
                <p style="text-align: center; font-size: 0.9rem;">
                    Already have an account? <a href="{% url 'login' %}">Login here</a>
                </p>
            </form>
        </div>
    </div>
</section>
{% endblock %}
